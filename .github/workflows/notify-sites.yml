name: notify-sites

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask studio-server to rebuild the docs site
        env:
          TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SITES_DISPATCH_TOKEN is not set, the docs site will update on the next daily build"
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"bloom-docs-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}" \
            https://api.github.com/repos/FrameBuffer-Studio/studio-server/dispatches
          echo "studio-server will rebuild the docs site for ${GITHUB_SHA::7}"
