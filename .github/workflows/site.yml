name: site

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist/web
          include-hidden-files: true
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build --file site/Dockerfile --tag bloom-docs:ci .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: web
      - name: Publish to framebuffer-studio.github.io/Bloom
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          TARGET: FrameBuffer-Studio/framebuffer-studio.github.io
          FOLDER: Bloom
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::PAGES_DEPLOY_TOKEN is not set, skipping deploy"
            exit 0
          fi
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" pages
          rm -rf "pages/${FOLDER}"
          mkdir -p "pages/${FOLDER}"
          cp -a web/. "pages/${FOLDER}/"
          rm -f "pages/${FOLDER}/.nojekyll"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Site is already up to date"
            exit 0
          fi
          git commit --quiet --message "Deploy Bloom docs from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push --quiet origin HEAD
