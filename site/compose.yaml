services:
  docs:
    build:
      context: ..
      dockerfile: site/Dockerfile
    image: bloom-docs:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LOG_REQUESTS: "true"
      TRUST_PROXY: "false"
      RATE_LIMIT_BURST: "120"
      RATE_LIMIT_PER_SECOND: "20"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
