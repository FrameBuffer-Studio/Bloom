<!doctype html>
<html lang="ru" data-theme="mono" data-effects="on">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="__CSP__">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Bloom - low-level graphics for Roblox on EditableImage and buffer. Terminal-style documentation in Russian and English with /help, /fn and /search commands.">
    <title>Bloom · терминал документации</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="__CSS__" integrity="__CSS_SRI__">
    <script type="module" src="__JS__" integrity="__JS_SRI__"></script>
  </head>
  <body data-sidebar="closed">
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
    <div class="shell" id="shell">
      <header class="titlebar">
        <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="title"><strong>bloom</strong>@roblox: <span id="title-path">~/docs</span></div>
        <div class="titlebar-actions">
          <a class="title-action" id="repo-link" href="#/credits" target="_blank" rel="noopener noreferrer nofollow" hidden>git ↗</a>
          <button class="title-action lang-toggle" id="lang-toggle" type="button">RU / EN</button>
          <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">☰</button>
        </div>
      </header>
      <div class="workspace">
        <nav class="sidebar" id="sidebar"></nav>
        <main class="screen" id="screen" tabindex="-1">
          <div class="output" id="output" aria-live="polite"></div>
        </main>
      </div>
      <div class="composer">
        <div class="suggestions" id="suggestions" role="listbox" hidden></div>
        <div class="prompt">
          <label class="prompt-label" for="prompt">
            <span class="prompt-user">bloom</span><span class="prompt-at">@</span><span class="prompt-host">docs</span>
            <span class="prompt-path" id="prompt-path">~</span><span class="prompt-caret">❯</span>
          </label>
          <input id="prompt" type="text" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="/help">
        </div>
      </div>
      <footer class="statusbar" id="statusbar"></footer>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </body>
</html>
